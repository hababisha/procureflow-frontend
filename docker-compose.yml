services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procureflow-web
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:8080
      - NEXT_PUBLIC_APP_NAME=ProcureFlow
    restart: unless-stopped
    networks:
      - procureflow-network

networks:
  procureflow-network:
    name: procureflow-backend_procureflow-network
    external: true
